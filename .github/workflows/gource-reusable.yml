name: Gource visualization (reusable)

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gource-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gource:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout caller repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render Gource video
        uses: nbprojekt/gource-action@57256d303c5a9a5e72ed92ba13e3e83c5ec8b257 # v1.3.0
        with:
          gource_title: "${{ github.event.repository.name }} | Development History"
          gource_resolution: 1080p
          gource_fps: 60
          gource_auto_skip_seconds: 0.65
          gource_seconds_per_day: 0.12
          gource_time_scale: 1.5
          gource_font_size: 38
          gource_font_color: "E8EAF0"
          gource_background_color: "070B16"
          gource_overlay_background_color: "10182A"
          gource_bloom_multiplier: 0.5
          gource_bloom_intensity: 0.5
          gource_key: "--key"
          gource_camera_mode: "overview"
          gource_hide_items: "mouse"
          gource_user_scale: 1.25
          gource_dir_depth: 3
          gource_filename_time: 3.5
          gource_file_filter: '(^|/)gource\.mp4$|(__pycache__|\.pyc|node_modules|\.git/)'
          avatars_auto_fetch: true

      - name: Verify rendered video
        run: test -s ./gource/gource.mp4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y -qq ffmpeg

      # GitHub rejects files at 100 MB. Re-encode to a safe size before publishing.
      - name: Encode publishable MP4 with size guard
        shell: bash
        run: |
          set -euo pipefail
          LIMIT=$((95 * 1024 * 1024))
          ffmpeg -y -i gource/gource.mp4 -c:v libx264 -crf 20 -preset medium -tune film -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart gource.mp4
          size=$(stat -c%s gource.mp4)
          if [ "$size" -gt "$LIMIT" ]; then
            ffmpeg -y -i gource/gource.mp4 -c:v libx264 -crf 26 -preset medium -tune film -vf "scale=-1:720" -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart gource-720p.mp4
            mv gource-720p.mp4 gource.mp4
            size=$(stat -c%s gource.mp4)
          fi
          if [ "$size" -gt "$LIMIT" ]; then
            echo "::error::Generated video is still above 95 MiB."
            exit 1
          fi

      - name: Upload Gource video artifact
        uses: actions/upload-artifact@v4
        with:
          name: gource-${{ github.event.repository.name }}
          path: gource.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Publish root-level gource.mp4
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gource.mp4
          if git diff --cached --quiet; then
            echo "Gource video is already up to date."
          else
            git commit -m "chore: publish updated Gource video"
            git push
          fi
